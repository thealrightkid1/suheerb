<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suheer Baig — Freelance Editor & Writer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --bg:     #FAF8F3;
  --bg2:    #F2EFE7;
  --ink:    #1A1714;
  --ink2:   #5C5650;
  --ink3:   #9E9890;
  --clay:   #D4622A;
  --clay2:  #B8521F;
  --border: #E4DFD5;
  --serif:  'Fraunces', Georgia, serif;
  --sans:   'DM Sans', sans-serif;
  --mono:   'DM Mono', monospace;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  font-size: 17px;
  line-height: 1.75;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

/* NAV */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 0 2.5rem;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  font-style: italic;
  color: var(--ink);
  cursor: pointer;
}

.nav-links { display: flex; gap: 0.25rem; }

.nav-links a {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink3);
  padding: 0.4rem 0.85rem;
  border-radius: 100px;
  transition: background 0.2s, color 0.2s;
  cursor: pointer;
}

.nav-links a:hover { background: var(--bg2); color: var(--ink); }
.nav-links a.active { background: var(--clay); color: #fff; }

/* APP */
#app { padding-top: 58px; min-height: calc(100vh - 100px); }
.page { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

/* LAYOUT */
.wrap      { max-width: 860px;  margin: 0 auto; padding: 5rem 2.5rem; }
.wrap-wide { max-width: 1060px; margin: 0 auto; padding: 5rem 2.5rem; }

/* TYPE */
.tag {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--clay);
  display: block;
  margin-bottom: 1.25rem;
}

h1 {
  font-family: var(--serif);
  font-size: clamp(2.4rem, 6vw, 4.2rem);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 1.5rem;
}
h1 em { font-style: italic; color: var(--clay); }

h2 {
  font-family: var(--serif);
  font-size: clamp(1.6rem, 3.5vw, 2.6rem);
  font-weight: 300;
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin-bottom: 1.25rem;
}
h2 em { font-style: italic; color: var(--clay); }

p { color: var(--ink2); margin-bottom: 1.25rem; line-height: 1.85; font-size: 1rem; }
p:last-child { margin-bottom: 0; }

/* STATUS PILL */
.status-pill {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: #EDFAF2; border: 1px solid #C3E8D0; color: #2A7A4A;
  font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em;
  text-transform: uppercase; padding: 0.3rem 0.85rem;
  border-radius: 100px; margin-bottom: 2rem;
}
.status-dot {
  width: 6px; height: 6px; background: #3ecf6e; border-radius: 50%;
  animation: blink 2s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* SERVICE GRID */
.svc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1px; background: var(--border);
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}

.svc-card {
  background: var(--bg);
  padding: 1.75rem 1.5rem;
  cursor: pointer;
  transition: background 0.18s;
}
.svc-card:hover { background: var(--bg2); }

.svc-num {
  font-family: var(--mono); font-size: 0.56rem;
  color: var(--ink3); letter-spacing: 0.1em; margin-bottom: 0.75rem;
}

.svc-title {
  font-family: var(--serif); font-size: 1.1rem;
  font-weight: 400; color: var(--ink);
  margin-bottom: 0.5rem; line-height: 1.3;
}

.svc-short {
  font-size: 0.82rem; color: var(--ink3);
  line-height: 1.65; margin-bottom: 0.9rem;
}

.svc-more {
  font-family: var(--mono); font-size: 0.58rem;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--clay);
}

/* SERVICE PAGE */
.back {
  font-family: var(--mono); font-size: 0.6rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink3); cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.4rem;
  margin-bottom: 2rem; transition: color 0.2s;
}
.back:hover { color: var(--ink); }

.svc-header { border-bottom: 1px solid var(--border); padding-bottom: 3rem; margin-bottom: 3rem; }

.includes-list { display: flex; flex-direction: column; }

.includes-item {
  display: flex; align-items: flex-start; gap: 1rem;
  padding: 0.9rem 0; border-bottom: 1px solid var(--border);
  font-size: 0.9rem; color: var(--ink2); line-height: 1.65;
}
.includes-item:last-child { border-bottom: none; }

.inc-mark { color: var(--clay); font-family: var(--mono); font-size: 0.65rem; flex-shrink: 0; padding-top: 4px; }

.cta-box {
  background: var(--ink); border-radius: 6px;
  padding: 2.25rem 2.5rem; margin-top: 3rem;
  display: flex; align-items: center; justify-content: space-between;
  gap: 2rem; flex-wrap: wrap;
}
.cta-text { color: rgba(255,255,255,0.65); font-size: 0.92rem; }
.cta-text strong { color: #fff; display: block; font-family: var(--serif); font-size: 1.2rem; font-weight: 300; margin-bottom: 0.2rem; font-style: italic; }

.cta-btn {
  background: var(--clay); color: #fff;
  font-family: var(--mono); font-size: 0.62rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0.8rem 1.6rem; border-radius: 100px;
  white-space: nowrap; flex-shrink: 0; transition: background 0.2s;
}
.cta-btn:hover { background: var(--clay2); }

/* CREDS */
.creds {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 1.75rem 2.5rem;
  display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
}
.creds-label {
  font-family: var(--mono); font-size: 0.58rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3);
  white-space: nowrap; flex-shrink: 0;
}
.creds-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  font-family: var(--mono); font-size: 0.58rem;
  font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--ink2); padding: 0.25rem 0.7rem; border-radius: 100px;
}

/* CONTACT */
.contact-email {
  font-family: var(--serif);
  font-size: clamp(1.4rem, 4vw, 2.4rem);
  font-weight: 300; font-style: italic; color: var(--clay);
  display: inline-block; margin: 1.25rem 0 2.5rem;
  border-bottom: 1.5px solid transparent; transition: border-color 0.2s;
}
.contact-email:hover { border-color: var(--clay); }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 1px; background: var(--border);
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}
.detail-box { background: var(--bg); padding: 1.1rem 1.4rem; }
.detail-label {
  font-family: var(--mono); font-size: 0.56rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); margin-bottom: 0.35rem;
}
.detail-val { font-size: 0.86rem; color: var(--ink); line-height: 1.5; }

/* FOOTER */
#footer {
  border-top: 1px solid var(--border);
  padding: 1.25rem 2.5rem;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;
}
#footer p { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.06em; color: var(--ink3); margin: 0; }

/* RESPONSIVE */
@media (max-width: 640px) {
  #nav { padding: 0 1.25rem; }
  .nav-logo { font-size: 0.9rem; }
  .nav-links a { padding: 0.35rem 0.6rem; font-size: 0.56rem; }
  .wrap, .wrap-wide { padding: 3rem 1.25rem; }
  .creds { padding: 1.25rem; }
  #footer { padding: 1.25rem; flex-direction: column; text-align: center; }
  .cta-box { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<div id="nav">
  <span class="nav-logo" onclick="go('home')">Suheer Baig</span>
  <div class="nav-links">
    <a onclick="go('home')" data-page="home">Home</a>
    <a onclick="go('services')" data-page="services">Services</a>
    <a onclick="go('contact')" data-page="contact">Contact</a>
  </div>
</div>

<div id="app"></div>

<div id="footer">
  <p>© 2026 Suheer Baig — Independent Freelancer</p>
  <p>Literary Editor · Ghostwriter · Web Developer · US & Global</p>
</div>

<script>
const SERVICES = [
  {
    id:'memoir', num:'01',
    title:'Memoir & Narrative Nonfiction',
    tagline:'Your story, shaped into a book.',
    short:'Helping memoirists find structure, voice, and emotional truth — from scattered notes to a publication-ready manuscript.',
    body:'Memoir is one of the hardest forms to get right. The events are real, but the story still needs to be built — with a narrative arc, a clear point of view, and emotional honesty that holds a reader from page one to the last.',
    body2:'I work with memoirists at every stage: figuring out where to start, what the book is really about, what to cut, and how to write your own life in a way that makes strangers care. Same applies to narrative nonfiction — reported, research-driven, or personal essay collections.',
    includes:[
      'Developmental edit — structure, arc, pacing, point of view',
      'Line editing — prose rhythm, voice, clarity',
      'Chapter-by-chapter feedback and revision guidance',
      'Ghostwriting — full manuscript written in your voice',
      'Query letter and synopsis support'
    ]
  },
  {
    id:'fiction', num:'02',
    title:'Novel & Fiction Editing',
    tagline:'From draft to the version you meant to write.',
    short:'Developmental and line editing for literary fiction and genre novels at every draft stage.',
    body:'I work with novelists across the full range — literary, commercial, genre, and everything in between. A first draft that isn\'t working yet is completely normal. What matters is figuring out why, and knowing what to do next.',
    body2:'My focus is on what the novel is trying to be, and whether it gets there: structure, pacing, character arcs, prose. I give honest, specific feedback — not generic praise, not crushing critique. Just a clear read and a practical path forward.',
    includes:[
      'Full manuscript developmental edit',
      'Structural assessment — plot, pacing, arc, POV',
      'Character consistency and motivation',
      'Line editing — sentence rhythm, register, clarity',
      'Proofreading — final pass to publication-ready standard'
    ]
  },
  {
    id:'ghostwriting', num:'03',
    title:'Ghostwriting',
    tagline:'Your ideas. Your name. My words.',
    short:'Full manuscript ghostwriting for memoirs, business books, self-help, and nonfiction. Confidentiality guaranteed.',
    body:'You have the ideas, the story, the expertise — I do the writing. The book comes out under your name. Our arrangement stays between us. NDA is standard on every project.',
    body2:'The process starts with deep-dive interviews and a detailed brief, then continues with milestone drafts until we have a manuscript that sounds like you — just at your very best.',
    includes:[
      'Memoir, business, self-help, nonfiction — all genres',
      'Detailed interviews and voice profiling',
      'Full outline and chapter-by-chapter drafting',
      'Revisions within agreed scope',
      'Full NDA — complete confidentiality as standard'
    ]
  },
  {
    id:'research', num:'04',
    title:'Research & Academic Writing',
    tagline:'Rigorous writing that actually reads.',
    short:'Editing and writing support for research-heavy manuscripts, long-form essays, and academic nonfiction.',
    body:'My background is in criminology — so I understand how research-driven writing works: the argument structure, the sourcing, the logic, the need for precision without sacrificing readability.',
    body2:'I edit and write for researchers, academics, and nonfiction writers who need work that is both rigorous and accessible. Whether you\'re polishing a manuscript for a general audience or tightening an academic paper, I\'ll make sure the argument lands.',
    includes:[
      'Structural editing — argument clarity and logical flow',
      'Source integration and citation coherence',
      'Accessible rewriting for general audiences',
      'Academic proofreading — grammar, style, formatting',
      'Research writing support and ghostwriting'
    ]
  },
  {
    id:'editing', num:'05',
    title:'Line Editing & Proofreading',
    tagline:'Precision at the sentence level.',
    short:'Sentence-level editing for prose that reads with intention. Final proofreading to zero-error publication standard.',
    body:'Line editing is where the writing actually gets fixed. I work through your prose sentence by sentence — cutting what doesn\'t earn its place, improving rhythm and clarity, adjusting register, removing hedges and filler.',
    body2:'Proofreading is the final pass before your manuscript goes anywhere — grammar, punctuation, continuity, formatting. I maintained a zero-error standard across 400+ projects for global streaming clients. Every manuscript gets the same.',
    includes:[
      'Full manuscript line edit — rhythm, clarity, register',
      'Final proofread — grammar, punctuation, continuity',
      'Style sheet creation for consistency',
      'Chicago, APA, MLA style compliance',
      'Platform-specific formatting (KDP, Ingram, etc.)'
    ]
  },
  {
    id:'webdev', num:'06',
    title:'Web Development',
    tagline:'Clean, fast websites — built and shipped.',
    short:'Author websites, portfolio pages, and small business sites. Built in React or plain HTML/CSS and deployed live.',
    body:'I build websites for authors, independent professionals, and small businesses. Nothing over-engineered — just clean, fast, well-designed sites that work and look good.',
    body2:'My stack is React + Vite for dynamic builds, plain HTML/CSS/JS for lightweight sites, deployed on Vercel. I handle design to deployment and hand it over ready to go. If you need a web presence, I\'ll build it.',
    includes:[
      'Author websites and portfolio pages',
      'React + Vite or plain HTML/CSS builds',
      'Deployed on Vercel — live within days',
      'Mobile responsive, fast-loading, SEO-ready',
      'CMS integration (Sanity.io) for self-managed content'
    ]
  }
];

function go(page, id) {
  window.location.hash = id ? `${page}/${id}` : page;
}

function route() {
  const hash = window.location.hash.replace('#','') || 'home';
  const [page, sub] = hash.split('/');

  document.querySelectorAll('.nav-links a').forEach(a => {
    const match = a.dataset.page === page || (page === 'service' && a.dataset.page === 'services');
    a.classList.toggle('active', match);
  });

  const app = document.getElementById('app');
  if (page === 'services') app.innerHTML = pageServices();
  else if (page === 'service' && sub) app.innerHTML = pageService(sub);
  else if (page === 'contact') app.innerHTML = pageContact();
  else app.innerHTML = pageHome();

  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);

function creds() {
  return `<div class="creds">
    <span class="creds-label">Prior work via</span>
    <div class="creds-chips">
      ${['ZOO Digital','Netflix','Apple TV+','BBC','Sony','Paramount','Warner Bros.','Northgate Editorial'].map(n=>`<span class="chip">${n}</span>`).join('')}
    </div>
  </div>`;
}

function grid() {
  return `<div class="svc-grid">
    ${SERVICES.map(s=>`
      <div class="svc-card" onclick="go('service','${s.id}')">
        <div class="svc-num">${s.num}</div>
        <div class="svc-title">${s.title}</div>
        <div class="svc-short">${s.short}</div>
        <div class="svc-more">Learn more →</div>
      </div>`).join('')}
  </div>`;
}

function pageHome() {
  return `<div class="page">
    <div class="wrap" style="padding-bottom:3rem;">
      <div class="status-pill"><span class="status-dot"></span>Open to new projects</div>
      <h1>Literary editor,<br>ghostwriter &<br><em>web builder.</em></h1>
      <p style="font-size:1.05rem; max-width:560px;">I'm Suheer Baig — an independent freelancer working with authors, researchers, and businesses across the US and internationally. I help people write better books and build a web presence worth having.</p>
      <p style="font-size:0.85rem; color:var(--ink3);">Remote-friendly &nbsp;·&nbsp; All time zones &nbsp;·&nbsp; NDA available</p>
    </div>
    <div class="wrap-wide" style="padding-top:0;">
      <span class="tag">Services</span>
      ${grid()}
    </div>
    ${creds()}
  </div>`;
}

function pageServices() {
  return `<div class="page">
    <div class="wrap" style="padding-bottom:2rem;">
      <span class="tag">All services</span>
      <h1>What I <em>offer.</em></h1>
      <p>Each service has its own page with a full breakdown. Click any card.</p>
    </div>
    <div class="wrap-wide" style="padding-top:0; padding-bottom:4rem;">
      ${grid()}
    </div>
    ${creds()}
  </div>`;
}

function pageService(id) {
  const s = SERVICES.find(x => x.id === id);
  if (!s) return pageHome();
  return `<div class="page">
    <div class="wrap">
      <span class="back" onclick="go('services')">← Back to services</span>
      <div class="svc-header">
        <span class="tag">${s.num} — ${s.title}</span>
        <h1><em>${s.tagline}</em></h1>
        <p>${s.body}</p>
        <p>${s.body2}</p>
      </div>
      <span class="tag" style="margin-bottom:0.5rem;">What's included</span>
      <div class="includes-list">
        ${s.includes.map(i=>`<div class="includes-item"><span class="inc-mark">✦</span><span>${i}</span></div>`).join('')}
      </div>
      <div class="cta-box">
        <div class="cta-text"><strong>Interested? Let's talk.</strong>Email me with a brief description of your project and I'll get back to you within 24 hours.</div>
        <a href="mailto:baigsuheer.s@gmail.com" class="cta-btn">baigsuheer.s@gmail.com →</a>
      </div>
    </div>
    ${creds()}
  </div>`;
}

function pageContact() {
  return `<div class="page">
    <div class="wrap">
      <span class="tag">Get in touch</span>
      <h1>Let's work <em>together.</em></h1>
      <p style="max-width:520px;">The best way to reach me is email. Tell me about your project — manuscript stage, what you need, your timeline. I read everything and reply within 24 hours.</p>
      <a class="contact-email" href="mailto:baigsuheer.s@gmail.com">baigsuheer.s@gmail.com</a>
      <span class="tag" style="margin-bottom:0.75rem;">Details</span>
      <div class="detail-grid">
        <div class="detail-box"><div class="detail-label">Availability</div><div class="detail-val">Open to new projects</div></div>
        <div class="detail-box"><div class="detail-label">Response time</div><div class="detail-val">Within 24 hours</div></div>
        <div class="detail-box"><div class="detail-label">Clients</div><div class="detail-val">US & international</div></div>
        <div class="detail-box"><div class="detail-label">Confidentiality</div><div class="detail-val">NDA on every project</div></div>
        <div class="detail-box"><div class="detail-label">Focus areas</div><div class="detail-val">Memoir · Fiction · Nonfiction · Research · Web</div></div>
        <div class="detail-box"><div class="detail-label">Education</div><div class="detail-val">BA Criminology — John Jay College, New York</div></div>
      </div>
    </div>
    ${creds()}
  </div>`;
}

route();
</script>
</body>
</html>
